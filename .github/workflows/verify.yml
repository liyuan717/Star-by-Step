name: Verify offline mobile
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p .tmp
      - run: pnpm typecheck && pnpm lint && pnpm test --runInBand --testTimeout=30000 && pnpm test:unit && pnpm test:offline
      - run: pnpm check:release
      - run: pnpm exec expo export --platform android --output-dir dist/android
